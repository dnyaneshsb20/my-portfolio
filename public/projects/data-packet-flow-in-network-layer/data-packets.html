<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCP/IP Simulation</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .back-to-portfolio {
        position: fixed;
        top: 40px;
        right: 20px;
        background-color: #c7d2fe;
        color: #1e40af;
        border: none;
        padding: 0.5rem 1rem;
        font-weight: 600;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.3s ease;
        font-family: Arial, sans-serif;
        z-index: 1000;
      }

      .back-to-portfolio:hover {
        background-color: #a5b4fc;
        color: #3730a3;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <h1>Data Packet Flow in Network Layer</h1>

    <div class="controls">
      <input
        type="text"
        id="input-data"
        placeholder="Enter data to send"
        value="Hello Net!"
      />
      <button id="start-btn">Start</button>
      <button id="reset-btn" disabled>Reset</button>
      <button id="next-btn" disabled>Next Step</button>
    </div>

    <div class="simulation-wrapper">
      <div class="simulation-container">
        <div class="node sender">
          <h2>Sender</h2>
          <div class="layers">
            <div class="layer link" id="sender-link">
              Link (Ethernet)
              <div class="data-unit" id="sender-link-data"></div>
            </div>
            <div class="layer internet" id="sender-internet">
              Internet (IP)
              <div class="data-unit" id="sender-internet-data"></div>
            </div>
            <div class="layer transport" id="sender-transport">
              Transport (TCP)
              <div class="data-unit" id="sender-transport-data"></div>
            </div>
            <div class="layer application" id="sender-app">
              Application
              <div class="data-unit" id="sender-app-data"></div>
            </div>
          </div>
        </div>

        <div class="raw-packet-view">
          <h2>Sender Packet Structure</h2>
          <pre id="sender-raw-packet-display" class="raw-packet-display">
Packet structure will appear here.</pre
          >
        </div>

        <div class="node receiver">
          <h2>Receiver</h2>
          <div class="layers">
            <div class="layer link" id="receiver-link">
              Link (Ethernet)
              <div class="data-unit" id="receiver-link-data"></div>
            </div>
            <div class="layer internet" id="receiver-internet">
              Internet (IP)
              <div class="data-unit" id="receiver-internet-data"></div>
            </div>
            <div class="layer transport" id="receiver-transport">
              Transport (TCP)
              <div class="data-unit" id="receiver-transport-data"></div>
            </div>
            <div class="layer application" id="receiver-app">
              Application
              <div class="data-unit" id="receiver-app-data"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="network">
        <div class="wire"></div>
        <div class="packet" id="network-packet"></div>
      </div>
    </div>

    <div class="info-panel" id="info-panel">
      Ready. Enter data and click Start.
    </div>
    <hr />
    <a href="/?skipIntro=true#projects"
       style="
         position: fixed;
         top: 1.5rem;          /* top-6 */
         left: 1.5rem;         /* left-6 */
         background-color: #1e40af;  /* navy blue */
         color: white;         /* text-white */
         padding: 0.5rem 1rem; /* px-4 py-2 */
         border-radius: 0.5rem; /* rounded */
         font-weight: 600;     /* font-semibold */
         box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* shadow-md */
         text-decoration: none;
         transition: all 0.3s ease;
         z-index: 1000;
       "
       onmouseover="this.style.backgroundColor='#1e3a8a';"
       onmouseout="this.style.backgroundColor='#1e40af';"
    >
      🔙 Back to Portfolio
    </a>
  </body>
</html>
